<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="acidMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2ED573"/>
    </linearGradient>
    <linearGradient id="solarYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <radialGradient id="studioGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.35)"/>
      <stop offset="70%" stop-color="rgba(46, 213, 115, 0.08)"/>
      <stop offset="100%" stop-color="rgba(11, 15, 25, 0)"/>
    </radialGradient>

    <!-- Filter for subtle futuristic glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatGlyph {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .rune-orbit {
      transform-origin: 200px 200px;
      animation: pulseSpin 36s linear infinite;
    }
    .glyph-floating {
      animation: floatGlyph 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background Glow -->
  <rect width="400" height="400" rx="36" fill="#0B0F19"/>
  <circle cx="200" cy="200" r="170" fill="url(#studioGlow)"/>

  <!-- Outer Architectural Framing & Crosshairs (Studio Dumbar / Bauhaus Style) -->
  <rect x="24" y="24" width="352" height="352" rx="24" fill="none" stroke="#232F4D" stroke-width="1.5" stroke-dasharray="6 6"/>
  
  <!-- Corner Brackets -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M 360 60 L 360 40 L 340 40" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 340 L 40 360 L 60 360" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M 360 340 L 360 360 L 340 360" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

  <!-- Technical Marks & Coordinates -->
  <text x="70" y="48" font-family="'Space Grotesk', monospace, sans-serif" font-size="9" fill="#94A3B8" letter-spacing="2">SYS.LAB // 50°56'N 4°03'E</text>
  <text x="280" y="48" font-family="'Space Grotesk', monospace, sans-serif" font-size="9" fill="#FFD13B" font-weight="900" letter-spacing="1">[★ WAIE]</text>
  
  <text x="40" y="380" font-family="'Space Grotesk', monospace, sans-serif" font-size="9" fill="#64748B" letter-spacing="2">TYPE: AVANT-GARDE</text>
  <text x="315" y="380" font-family="'Space Grotesk', monospace, sans-serif" font-size="9" fill="#2ED573" font-weight="bold" letter-spacing="2">VER.26</text>

  <!-- Crosshairs -->
  <line x1="200" y1="28" x2="200" y2="44" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="356" x2="200" y2="372" stroke="#475569" stroke-width="2"/>
  <line x1="28" y1="200" x2="44" y2="200" stroke="#475569" stroke-width="2"/>
  <line x1="356" y1="200" x2="372" y2="200" stroke="#475569" stroke-width="2"/>

  <!-- Concentric Orbit Ring with Runes / Weird Glyphs -->
  <g class="rune-orbit">
    <circle cx="200" cy="200" r="140" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="200" cy="60" r="3" fill="#FFD13B"/>
    <circle cx="340" cy="200" r="3" fill="#2ED573"/>
    <circle cx="200" cy="340" r="3" fill="#FF6584"/>
    <circle cx="60" cy="200" r="3" fill="#6366F1"/>
    
    <!-- Eccentric typographic glyphs on orbit -->
    <text x="195" y="76" font-family="monospace" font-size="11" fill="#FFD13B" text-anchor="middle">✦</text>
    <text x="325" y="204" font-family="monospace" font-size="12" fill="#2ED573" text-anchor="middle">▲</text>
    <text x="200" y="332" font-family="monospace" font-size="11" fill="#FF6584" text-anchor="middle">∿</text>
    <text x="75" y="204" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle">⊞</text>
  </g>

  <!-- INNER SHARD PRISM (ABSTRACT GEOMETRIC 'W' MARK) -->
  <g id="abstract-W" transform="translate(0, 0)">
    <!-- Shard 1 (Left Wing Down) -->
    <polygon points="105,120 145,120 168,260 128,260" fill="url(#neonViolet)" filter="url(#glow)"/>
    <polygon points="105,120 145,120 168,260 128,260" fill="url(#neonViolet)"/>

    <!-- Shard 2 (Center Ascent Left) -->
    <polygon points="128,260 168,260 200,165 175,165" fill="#3B82F6"/>
    
    <!-- Shard 3 (Center Apex Shard - Electric Violet/Mint Cut) -->
    <polygon points="175,165 200,165 225,165 200,278" fill="url(#acidMint)" filter="url(#glow)"/>
    <polygon points="175,165 200,165 225,165 200,278" fill="url(#acidMint)"/>

    <!-- Shard 4 (Center Ascent Right) -->
    <polygon points="200,165 225,165 272,260 232,260" fill="#10B981"/>

    <!-- Shard 5 (Right Wing Up) -->
    <polygon points="255,120 295,120 272,260 232,260" fill="url(#solarYellow)" filter="url(#glow)"/>
    <polygon points="255,120 295,120 272,260 232,260" fill="url(#solarYellow)"/>

    <!-- Geometric Accent Slice Lines -->
    <line x1="88" y1="210" x2="312" y2="210" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  </g>

  <!-- Central Surreal Studio Glyph Accent: The Floating Inverted Triangle & Eyemark -->
  <g class="glyph-floating">
    <!-- Floating Cyber Sparkle Star -->
    <path d="M 200 112 Q 200 128 184 128 Q 200 128 200 144 Q 200 128 216 128 Q 200 128 200 112 Z" fill="#FFFFFF"/>
    <circle cx="200" cy="128" r="3" fill="#FFD13B"/>

    <!-- Eccentric Floating Studio Glyphs -->
    <text x="100" y="165" font-family="'Space Grotesk', monospace" font-size="20" font-weight="900" fill="#FF6584">[</text>
    <text x="290" y="165" font-family="'Space Grotesk', monospace" font-size="20" font-weight="900" fill="#2ED573">]</text>
    <text x="135" y="300" font-family="'Space Grotesk', monospace" font-size="16" font-weight="900" fill="#FFD13B">::</text>
    <text x="255" y="300" font-family="'Space Grotesk', monospace" font-size="16" font-weight="900" fill="#6366F1">::</text>
    <text x="200" y="315" font-family="'Righteous', cursive, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">W▲!Ξ</text>
  </g>
</svg>
