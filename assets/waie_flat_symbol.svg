<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- WAIE Flat Graphic Studio Symbol (W ▲ ! Ξ) -->
  <defs>
    <filter id="flat-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Off-White Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="40" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#flat-drop)"/>

  <!-- Minimalist Inner Architectural Frame with Corner Cuts -->
  <rect x="44" y="44" width="424" height="424" rx="28" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Technical Marks -->
  <text x="64" y="80" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="900" fill="#64748B" letter-spacing="2">WAIE // STUDIO LAB</text>
  <text x="400" y="80" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="end" letter-spacing="2">[50°N 4°E]</text>

  <!-- Divider line -->
  <line x1="64" y1="96" x2="448" y2="96" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 4 GLYPHS IN 2x2 BALANCED GRID (Pure Flat Graphic, Clean Silhouettes) -->

  <!-- Top Left: W (Deep Ink Black) -->
  <g transform="translate(90, 140)">
    <path d="M 10 15 L 35 95 L 60 35 L 85 95 L 110 15" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Right: ▲ (Vibrant Solar Yellow) -->
  <g transform="translate(300, 140)">
    <polygon points="60,10 5,100 115,100" fill="#FFD13B" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Left: ! (Electric Cobalt Indigo) -->
  <g transform="translate(90, 280)">
    <rect x="51" y="15" width="18" height="52" rx="9" fill="#6366F1"/>
    <circle cx="60" cy="88" r="10" fill="#6366F1"/>
  </g>

  <!-- Bottom Right: Ξ (Cyber Mint) -->
  <g transform="translate(300, 280)">
    <rect x="15" y="18" width="90" height="15" rx="7.5" fill="#10B981"/>
    <rect x="15" y="47" width="90" height="15" rx="7.5" fill="#10B981"/>
    <rect x="15" y="76" width="90" height="15" rx="7.5" fill="#10B981"/>
  </g>

  <!-- Bottom Meta Bar -->
  <line x1="64" y1="416" x2="448" y2="416" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="442" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="3">FLAT GRAPHIC • CREATIVE APPS</text>
  <text x="448" y="442" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="900" fill="#6366F1" text-anchor="end" letter-spacing="2">VER.26</text>
</svg>
