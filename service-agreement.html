    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.documentElement.lang = lang;
      document.getElementById('termsContent').innerHTML = TERMS[lang] || TERMS.en;
    }

    const browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    const initialLang = TERMS[browserLang] ? browserLang : 'en';
    const initialBtn = Array.from(document.querySelectorAll('.lang-btn')).find(b => b.getAttribute('onclick').includes("'" + initialLang + "'"));
    setLang(initialLang, initialBtn || document.querySelector('.lang-btn'));
  </script>
